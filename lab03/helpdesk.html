<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8" />
    <meta name="description" content="Demonstrates some basic HTML form elements" />
    <meta name="keywords" content="HTML, Form, tags" />
    <meta name="SyTho" content="Students"  />
    <title>Lab3</title>
</head>
<body>
    <main>
        <header>
            <h1>COS10026</h1>
            <p><strong>Technology Project LAB3 </strong>  </p>
            <img src="logo.png" alt="Swinburne University of Technology" width="158" height="79">
        </header>
    </main>

    <section>
        <h1>CWA Help Desk Appointment</h1>
        <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
        <p>Check Blackboard for when CWA tutors will be there.</p>
        <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
            <fieldset>
                <legend>Student details</legend>
                <p>
                    <label for="student-id">Student ID</label>
                    <input type="text" name="student_id" id="student-id" size="10" maxlength="10" pattern="[0-9]{7,10}" title="Enter between 7 and 10 digits" required="required">
                </p>
                <p>
                    <label for="given-name">Given Name</label>
                    <input type="text" name="given_name" id="given-name" size="15" maxlength="15" pattern="[A-Za-z]+" title="Use alphabetical characters only" required="required">
                    <label for="family-name">Family Name</label>
                    <input type="text" name="family_name" id="family-name" size="15" maxlength="15" pattern="[A-Za-z]+" title="Use alphabetical characters only" required="required">
                </p>
            </fieldset>
            <fieldset>
                <legend>Your unit</legend>
                <p>
                    <input type="radio" name="unit" id="cos10011" value="COS10011" required="required">
                    <label for="cos10011">COS10011</label>
                    <input type="radio" name="unit" id="cos60004" value="COS60004">
                    <label for="cos60004">COS60004</label>
                    <input type="radio" name="unit" id="cos60007" value="COS60007">
                    <label for="cos60007">COS60007</label>
                </p>
                <p>
                    <label for="tutor">Your Tutor</label>
                    <select name="tutor" id="tutor" required="required">
                        <option value="">Please Select</option>
                        <option value="john-smith">John Smith</option>
                        <option value="mary-jones">Mary Jones</option>
                        <option value="david-lee">David Lee</option>
                    </select>
                </p>
            </fieldset>
            <fieldset>
                <legend>Issue</legend>
                <p>
                    <label for="html">HTML</label>
                    <input type="checkbox" name="issue[]" id="html" value="HTML" checked="checked">
                    <label for="css">CSS</label>
                    <input type="checkbox" name="issue[]" id="css" value="CSS">
                    <label for="javascript">JavaScript</label>
                    <input type="checkbox" name="issue[]" id="javascript" value="JavaScript">
                    <label for="php">PHP</label>
                    <input type="checkbox" name="issue[]" id="php" value="PHP">
                    <label for="mysql">MySQL</label>
                    <input type="checkbox" name="issue[]" id="mysql" value="MySQL">
                </p>
                <p>
                    <label for="description">Description of Issue</label><br>
                    <textarea name="description" id="description" rows="5" cols="30" placeholder="Write description of your problem here..."></textarea>
                </p>
            </fieldset>
            <fieldset>
                <legend>Preferred Date / Time</legend>
                <label for="date">Date</label>
                <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" maxlength="10" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Use the format dd/mm/yyyy"><br>
                <label for="time">Time</label>
                <input type="text" name="time" id="time" placeholder="00:00" maxlength="5" pattern="[0-9]{2}:[0-9]{2}" title="Use the format hh:mm">
            </fieldset>
            <input type="submit" value="Book">
            <input type="reset" value="Reset form">
        </form>
    </section>

</body>
</html>
